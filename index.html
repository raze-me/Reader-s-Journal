<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Reader's Journal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <img src="assets/HackclubFlag.png" alt="HackClub" class="hackclub-flag"/>
    <div class="app-shell">
        <aside class="sidebar" aria-label="Main navigation">
            <a class="nav-link active" href="#home" aria-current="page">Home</a>
        
            <span class="nav-link muted" aria-disabled="true">More Soon</span>
            <button class="spooky-toggle" id="spooky-toggle" type="button" aria-pressed="false">Turn On Spooky Vibes </button>
        </aside>

        <main class="main-content" id="home">
            <header class="page-heading">
                <img src="assets/Reader’s Journal Title.svg" alt="Reader's Journal" class="journal-title" />
            </header>
            
            <div class="workspace">
                <section class="records-panel" aria-labelledby="books-heading">
                    <div class="records-heading">
                        <h1 id="books-heading">Book's Read</h1>
                        <div class="record-actions">
                            <button id="add-button" class="image-button" type="button" aria-label="Add a book">
                                <img src="assets/addButton.svg" alt="Add Button" />
                            </button>
                            <button id="delete-button" class="image-button" type="button" aria-label="Delete a selected book"><img src="assets/deleteButton.svg" alt="delete-button" /></button>
                        </div>
                    </div>
                    <p class="empty-message" id="empty-message">*No books in Record</p>
                    <div class="table-wrap">
                        <table id="books-table" aria-label="Books read" hidden>
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Author</th>
                                    <th>Time</th>
                                </tr>
                            </thead>
                            <tbody id="books-list"></tbody>
                            
                        </table>
                    </div>
                    <p id="selection-hint" class="selection-hint" hidden>Click a book to select it</p>
                </section>
                
                <section class="entry-panel" aria-label="Books details form">
                    <form id="book-form" autocomplete="off">
                        <label for="book-title" class="visually-hidden">Book title</label>
                        <input type="text" id="book-title" name="title" class="field title-field" placeholder="Title" required disabled maxlength="160" />
                        <label class="visually-hidden" for="book-volume">Volume</label>
                        <input id="book-volume" name="volume" class="field volume-field" type="text" placeholder="Volume" disabled maxlength="80" />
                        <label class="visually-hidden" for="book-author">Author</label>
                        <input id="book-author" name="author" class="field author-field" type="text" placeholder="Author" disabled maxlength="120" />

                        <div class="chapter-line">
                            <label for="book-chapters" class="visually-hidden">Chapters Completed</label>
                            <input id="book-chapters" name="chapters"  type="number" min="1" step="1" class="field chapters-field" placeholder="chapters-completed" disabled/>
                            <span class="info-wrap">
                                <button class="info-button" type="button" aria-label="Information about the chapters completed" aria-describedby="chapter-tooltip"><img src="assets/infoButton.svg" alt="info" /></button>
                                <span class="tooltip" id="chapter-tooltip" role="tooltip">Leave this blank if finished the whole book. A blank chapter count is saved as fully completed.</span>
                            </span>
                        </div>
                        
                        <div class="submit-row"><button class="image-button submit-button" type="submit" aria-label="Submit book" id="submit-button" disabled><img src="assets/submitButton.svg" alt="Submit"></button></div>

                        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>

                    </form>
                </section>
            </div>
        </main>



        
        <aside class="sticker-rail" aria-label="Reader Sticker">
            <img src="assets/Sticker1.png" alt="A reader relaxing with a book" />
            <img src="assets/Sticker2.png" alt="A reader floating on an orange book" />
            <img src="assets/Sticker3.png" alt="A reader curled up in an armchair" />
            
        </aside>
    </div>
    <script src="app.js"></script>
</body>
</html>
